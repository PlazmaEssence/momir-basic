<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Momir Vig</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Momir Vig</h1>
  <div id="status" class="status">connecting…</div>
</header>

<main>
  <section class="tracker-toggle-bar">
    <label class="checkbox">
      <input type="checkbox" id="tracker-toggle">
      Life / Hand / Land Tracker
    </label>
  </section>

  <section id="tracker-panel" class="tracker-panel hidden">
    <div id="tracker-players" class="tracker-players"></div>
    <div class="tracker-footer">
      <button id="tracker-add-player" type="button">+ Add Player</button>
      <button id="tracker-reset" type="button" class="danger-btn">Reset Game</button>
    </div>
  </section>

  <template id="icon-life">
    <svg viewBox="0 0 32 29" class="stat-icon-svg" aria-hidden="true">
      <path d="M16 29 C16 29 0 18.5 0 8.5 C0 3.8 3.8 0 8.5 0 C12 0 14.8 2.1 16 5.2 C17.2 2.1 20 0 23.5 0 C28.2 0 32 3.8 32 8.5 C32 18.5 16 29 16 29 Z"/>
    </svg>
  </template>

  <template id="icon-hand">
    <svg viewBox="0 0 34 36" class="stat-icon-svg" aria-hidden="true">
      <rect x="11" y="2" width="20" height="24" rx="3" class="stat-icon-bg"/>
      <rect x="3" y="10" width="20" height="24" rx="3"/>
    </svg>
  </template>

  <template id="icon-land">
    <svg viewBox="0 0 600 480" class="stat-icon-svg" aria-hidden="true">
      <rect x="8" y="370" width="584" height="104" rx="52"/>
      <path d="M60 460 L195 40 Q218 0 241 40 L372 300 Z"/>
      <path d="M340 320 L405 160 Q428 120 451 160 L566 430 Z"/>
    </svg>
  </template>

  <section class="summon-panel">
    <label for="cmc-input">Mana Value</label>
    <div class="stepper">
      <button id="cmc-down" class="stepper-btn" aria-label="decrease">−</button>
      <input id="cmc-input" type="number" min="0" max="20" value="3" inputmode="numeric">
      <button id="cmc-up" class="stepper-btn" aria-label="increase">+</button>
    </div>
    <div id="cmc-count" class="cmc-count"></div>
    <button id="summon-btn" class="primary-btn">Summon</button>
  </section>

  <section id="preview-panel" class="preview-panel hidden">
    <img id="preview-img" alt="Card preview">
    <div id="preview-meta" class="preview-meta"></div>
    <div class="preview-actions">
      <button id="reroll-btn">Reroll</button>
      <button id="regenerate-btn">Regenerate</button>
      <button id="print-btn" class="primary-btn">Print</button>
    </div>
    <div id="print-result" class="print-result"></div>
  </section>

  <details class="token-panel">
    <summary>Tokens</summary>
    <input id="token-search" type="search" placeholder="Search tokens…" autocomplete="off">
    <div id="token-recent-label" class="token-label hidden">Recent</div>
    <div id="token-recent" class="token-grid"></div>
    <div class="token-label">All tokens</div>
    <div id="token-grid" class="token-grid"></div>
    <details class="token-custom">
      <summary>Make your own token</summary>
      <form id="token-custom-form">
        <input id="tc-name" type="text" placeholder="Name (e.g. Cat)" maxlength="40" required>
        <input id="tc-type" type="text" placeholder="Type line (e.g. Token Creature — Cat)" maxlength="60">
        <div class="token-pt">
          <input id="tc-power" type="text" placeholder="Power" maxlength="3" inputmode="numeric">
          <span>/</span>
          <input id="tc-toughness" type="text" placeholder="Toughness" maxlength="3" inputmode="numeric">
        </div>
        <textarea id="tc-text" placeholder="Rules text (optional)" maxlength="300" rows="2"></textarea>
        <button type="submit">Preview</button>
      </form>
    </details>
  </details>

  <details class="search-panel">
    <summary>Search &amp; print a specific card</summary>
    <input id="search-input" type="search" placeholder="Card name…" autocomplete="off">
    <ul id="search-results"></ul>
  </details>

  <details class="settings-panel">
    <summary>Settings</summary>
    <form id="settings-form">
      <label>
        Driver
        <select id="setting-driver">
          <option value="mock">Mock (preview PNG only)</option>
          <option value="escpos">ESC/POS thermal printer</option>
        </select>
      </label>
      <label>
        Paper width
        <select id="setting-width">
          <option value="80">80mm</option>
          <option value="58">58mm</option>
        </select>
      </label>
      <label>
        Card layout
        <select id="setting-layout">
          <option value="custom">Custom layout</option>
          <option value="full_card">Full card image</option>
        </select>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="setting-art" checked>
        Fetch card art
      </label>
      <button type="submit" class="primary-btn">Save</button>
      <span id="settings-result"></span>
    </form>
    <div class="db-update">
      <button id="rebuild-db-btn">Redownload &amp; rebuild card database</button>
      <span id="rebuild-db-result"></span>
    </div>
  </details>
</main>

<script src="/static/app.js"></script>
</body>
</html>
