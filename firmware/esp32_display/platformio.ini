; PlatformIO project for the Momir Vig ESP32 display/control panel.
; See README.md in this directory for setup steps that depend on the exact
; board (display/touch driver config, lv_conf.h) before this will build.

[env:esp32dev]
platform = espressif32
board = esp32dev  ; confirm against your board — most generic 2.8" boards use a plain ESP32-WROOM-32 module
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lvgl/lvgl@^8.3.0
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^6.21.0
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
